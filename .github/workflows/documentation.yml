name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.17.1'
      - name: Set up locked documentation dependencies
        shell: pwsh
        run: |
          npm install --global npm@11.4.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_manual.py --bootstrap
          exit $LASTEXITCODE
      - name: Validate content and local resources
        run: |
          python tools/build_manual.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_manual.py
          exit $LASTEXITCODE
      - name: Set up browser verification
        run: |
          npm install --prefix build/pages-tests --no-package-lock --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node build/pages-tests/node_modules/playwright/cli.js install chromium
          exit $LASTEXITCODE
      - name: Verify the offline visual reader
        run: |
          $env:NODE_PATH = Join-Path $pwd 'build/pages-tests/node_modules'
          node tools/test_manual_browser.cjs
          exit $LASTEXITCODE
      - name: Stage the complete export only
        run: python tools/stage_documentation.py --output build/pages-site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the reader
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
