<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<title>Shaderixel documentation</title>
<style>
:root{color-scheme:dark;--bg:#17191f;--panel:#222630;--fg:#e6e8ee;--muted:#aeb8cb;--accent:#b6a2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,sans-serif}
header{padding:16px 24px;border-bottom:1px solid #414754;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
header strong{font-size:20px}header span,small{color:var(--muted)}figure{margin:24px 0}figure img{display:block;max-width:100%;height:auto;border-radius:8px}button.figure{padding:0;width:100%;border:1px solid #596780;cursor:zoom-in;background:transparent}figcaption{font-size:14px;color:var(--muted);margin-top:8px}dialog{background:var(--bg);color:var(--fg);border:1px solid #687184;max-width:95vw;max-height:95vh;padding:20px}dialog::backdrop{background:#000b}dialog img{display:block;max-width:88vw;max-height:78vh;object-fit:contain}dialog p{margin:10px 0 0}header select{width:auto;margin:0}a{color:var(--accent)}button,input,select{font:inherit;border:1px solid #687184;border-radius:5px;padding:7px 10px;background:var(--panel);color:var(--fg)}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);flex:1;min-height:0}body{height:100vh;display:flex;flex-direction:column}header{flex-shrink:0}aside{background:var(--panel);padding:18px;overflow:auto}label{display:block;margin-bottom:7px}input,select{width:100%;margin-bottom:12px}#status{font-size:13px;color:var(--muted)}nav a{display:block;color:var(--fg);padding:9px;border-radius:5px;text-decoration:none;margin:3px 0;line-height:1.4}nav a:hover,nav a[aria-current=page]{background:#42415c}nav small{display:block;font-size:12px}nav a[hidden]{display:none}
main{overflow:auto;padding:32px clamp(20px,5vw,80px)}article{max-width:900px;margin:auto;font-size:calc(1rem * var(--text-scale,1))}h1{font-size:2em;line-height:1.2;margin:12px 0 25px}h2{font-size:1.3125em;border-bottom:1px solid #414754;margin-top:30px;padding-bottom:6px}p,pre{overflow-wrap:anywhere}pre{white-space:pre-wrap;background:var(--panel);padding:16px}#empty{color:var(--muted)}#chapter-tools{max-width:900px;margin:0 auto 18px}
@media(max-width:720px){body{height:auto}.layout{display:block;height:auto}aside{max-height:45vh}main{overflow:visible;padding:24px}h1{font-size:1.7em}}
@media print{header,aside,#empty,dialog,#chapter-tools{display:none}body.print-handbook article{display:none!important}body.print-handbook article[data-print=true]{display:block!important;break-before:page}.layout{display:block;height:auto}main{overflow:visible;padding:0}body{background:white;color:black;display:block;height:auto}article{max-width:none;font-size:16px}article:not([hidden]){display:block}h2{break-after:avoid}a,small{color:#333}p,pre,figure{break-inside:avoid}}
</style>
</head>
<body>
<header><strong data-ui="Documentation">Documentation</strong><span data-ui="Subtitle">Offline handbook and shipped library reference</span>
<label for="language" data-ui="Language">Language</label><select id="language"></select>
<label for="text-size" data-ui="Text size">Text size</label><select id="text-size"><option value=".85">85%</option><option value="1" selected>100%</option><option value="1.15">115%</option><option value="1.3">130%</option><option value="1.5">150%</option></select>
<button id="print" type="button" data-ui="Print chapter">Print chapter</button><button id="print-all" type="button" data-ui="Print handbook">Print handbook</button></header>
<div class="layout">
<aside aria-label="Documentation navigation">
<label for="search" data-ui="Search all documentation">Search all documentation</label><input id="search" type="search" autocomplete="off">
<label for="kind" data-ui="Show">Show</label><select id="kind"><option value="All" data-ui="All documentation">All documentation</option><option value="Handbook" data-ui="Handbook">Handbook</option><option value="Effects" data-ui="Effects">Effects</option><option value="Functions" data-ui="Functions">Functions</option><option value="Tools" data-ui="Tools">Tools</option><option value="Commands" data-ui="Commands">Commands</option><option value="Brushes" data-ui="Brushes">Brushes</option><option value="Nodes" data-ui="Nodes">Nodes</option></select>
<p id="status" role="status" aria-live="polite"></p><nav>
@@NAVIGATION@@
</nav></aside>
<main id="content" tabindex="-1"><p id="empty" data-ui="No results. Clear the search or choose another category." hidden></p>
<div id="chapter-tools"><label for="sections" data-ui="In this chapter">In this chapter</label><select id="sections"></select></div>
@@ARTICLES@@
</main></div>
<dialog id="zoom"><button id="close-zoom" type="button" data-ui="Close">Close</button><img id="zoom-image" alt=""><p id="zoom-caption"></p></dialog>
<script type="application/json" id="locales">@@LOCALES@@</script>
<script>
 'use strict';
const config=JSON.parse(document.getElementById('locales').textContent);
const language=document.getElementById('language');
for(const item of config.languages){const option=document.createElement('option');option.value=item.code;option.textContent=item.name;language.append(option);}
const articles=Array.from(document.querySelectorAll('article'));
const links=Array.from(document.querySelectorAll('nav a'));
const search=document.getElementById('search'),kind=document.getElementById('kind');
const content=document.getElementById('content'),empty=document.getElementById('empty');
const normalize=s=>s.toLocaleLowerCase().replaceAll('œ','oe').replaceAll('æ','ae').normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
const text=articles.map(p=>normalize(p.textContent+' '+p.dataset.page));
const supported=code=>config.languages.some(l=>l.code===code);
let currentLanguage=supported((navigator.language||'en').split('-')[0])?(navigator.language||'en').split('-')[0]:'en';
function selected(){
 let hash;try{hash=decodeURIComponent(location.hash.slice(1));}catch{hash='';}
 const slash=hash.indexOf('/');
 return slash<0?{language:currentLanguage,page:hash||'getting_started'}:{language:supported(hash.slice(0,slash))?hash.slice(0,slash):'en',page:hash.slice(slash+1)||'getting_started'};
}
const T=key=>config.ui[currentLanguage][key]||config.ui.en[key]||key;
function updateLabels(){
 document.documentElement.lang=currentLanguage;language.value=currentLanguage;
 document.querySelectorAll('[data-ui]').forEach(e=>e.textContent=T(e.dataset.ui));
 search.placeholder=T('Search hint');
 document.querySelector('aside').setAttribute('aria-label',T('Documentation'));
 document.querySelectorAll('button.figure').forEach(e=>e.setAttribute('aria-label',T('Click to enlarge')));
}
function show(){
 const selection=selected();currentLanguage=selection.language;
 let index=articles.findIndex(p=>p.dataset.page===selection.page&&p.dataset.language===currentLanguage);
 if(index<0)index=articles.findIndex(p=>p.dataset.page==='getting_started'&&p.dataset.language===currentLanguage);
 articles.forEach((p,i)=>p.hidden=i!==index);
 links.forEach((a,i)=>{if(i===index)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
 document.title=articles[index].querySelector('h1').textContent+' — Shaderixel';
 content.scrollTop=0;
 updateLabels();filter();
 const headings=Array.from(articles[index].querySelectorAll('h2'));
 const sections=document.getElementById('sections');sections.replaceChildren();
 const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent=T('In this chapter');sections.append(placeholder);
 headings.forEach((heading,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=heading.textContent;sections.append(option);});
 document.getElementById('chapter-tools').hidden=headings.length===0;
}
function filter(){
 const words=normalize(search.value).trim().split(/\s+/).filter(Boolean);
 let count=0;
 links.forEach((a,i)=>{a.hidden=a.dataset.language!==currentLanguage||(kind.value!=='All'&&a.dataset.kind!==kind.value)||!words.every(w=>text[i].includes(w));if(!a.hidden)++count;});
 document.getElementById('status').textContent=count+' '+T('matching pages');empty.hidden=count!==0;
}
language.addEventListener('change',()=>{location.hash=language.value+'/'+selected().page;});
document.getElementById('text-size').addEventListener('change',e=>{
 const scale=Number(e.target.value);if(Number.isFinite(scale)&&scale>=.85&&scale<=1.5)document.documentElement.style.setProperty('--text-scale',scale);
});
document.getElementById('sections').addEventListener('change',e=>{
 if(e.target.value==='')return;
 const heading=document.querySelector('article:not([hidden])').querySelectorAll('h2')[Number(e.target.value)];
 if(heading)heading.scrollIntoView({block:'start'});e.target.value='';
});
search.addEventListener('input',filter);kind.addEventListener('change',filter);
search.addEventListener('keydown',e=>{if(e.key==='Enter'){const a=links.find(a=>!a.hidden);if(a)location.hash=a.getAttribute('href');}else if(e.key==='Escape'){search.value='';filter();}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['k','f'].includes(e.key.toLowerCase())){e.preventDefault();search.focus();}});
document.querySelectorAll('button.figure').forEach(button=>button.addEventListener('click',()=>{
 const source=button.querySelector('img');const target=document.getElementById('zoom-image');
 target.src=source.src;target.alt=source.alt;document.getElementById('zoom-caption').textContent=source.alt;
 document.getElementById('zoom').showModal();
}));
document.getElementById('close-zoom').addEventListener('click',()=>document.getElementById('zoom').close());
async function printManual(all){
 const included=articles.filter(p=>p.dataset.language===currentLanguage&&(all?p.dataset.kind==='Handbook':!p.hidden));
 const pictures=included.flatMap(p=>Array.from(p.querySelectorAll('img')));
 pictures.forEach(img=>img.loading='eager');
 await Promise.all(pictures.map(img=>img.decode()));
 articles.forEach(p=>p.dataset.print=String(included.includes(p)));
 document.body.classList.toggle('print-handbook',all);window.print();
}
document.getElementById('print').addEventListener('click',()=>printManual(false));
document.getElementById('print-all').addEventListener('click',()=>printManual(true));
window.addEventListener('afterprint',()=>document.body.classList.remove('print-handbook'));
window.addEventListener('hashchange',show);show();
</script>
</body></html>
